name: Deploy to GitHub Pages

# Gatilhos: Quando o robô deve trabalhar
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# Permissões: O "crachá" de acesso do robô
permissions:
  contents: read
  pages: write
  id-token: write

# Concorrência: Organiza a fila de deploys
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest

    steps:
      # Passo 1: Baixa o seu código (Obrigatório!)
      - name: Checkout
        uses: actions/checkout@v4

      # Passo 2: Validar a sintaxe ANTES de preparar a entrega
      - name: Validar sintaxe do HTML
        uses: htmlhint/htmlhint-action@v2
        with:
          target_pattern: 'index.html'

      # Passo 3: PIPELINE DE PREPARAÇÃO
      - name: Preparando Versão de Produção (Build)
        run: |
          echo "Iniciando Pipeline de Preparação..."
          
          # Criando a pasta de distribuição (dist)
          mkdir -p dist
          
          # Movendo arquivos para a pasta de produção
          cp index.html dist/
          
          # Tenta copiar o CSS se ele existir
          cp style.css dist/ 2>/dev/null || echo "Aviso: style.css não encontrado."
          
          # Verificando se a pasta dist está correta
          ls -R dist/
          echo "Pasta de produção (dist) gerada com sucesso!"

      # Passo 4: Configura o ambiente para o GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      # Passo 5: Empacota o site APENAS da pasta DIST
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # IMPORTANTE: Mudamos de '.' para 'dist'
          path: 'dist' 
          
      # Passo 6: Publica o site oficialmente
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4